<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কৃষক নির্বাচন লটারী - সুনামগঞ্জ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
:root{
  --ink:#16261b; --muted:#5d6f62; --paper:#f4f1e8; --card:#fffdf8; --line:#dcd6c4;
  --green:#14532d; --green2:#1f7a43; --gold:#e0a82e; --red:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans Bengali',sans-serif;color:var(--ink);background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(circle at 15% 0%,#e6efdc 0,transparent 45%),radial-gradient(circle at 100% 100%,#f3e6c4 0,transparent 40%)}

header{background:linear-gradient(120deg,#0e3d20,var(--green) 60%,#1d6b3b);color:#fff;
  padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:4px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.18)}
header h1{font-size:clamp(18px,2.6vw,26px);font-weight:700;letter-spacing:.2px}
.badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#ffe9a8;
  padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}

.control-panel{margin:10px auto 0;width:calc(100% - 24px);background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 18px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:14px;box-shadow:0 6px 20px rgba(20,60,30,.08)}
.input-group{display:flex;flex-direction:column;min-width:150px;flex:1 1 150px;max-width:240px}
.input-group label{font-size:13px;font-weight:600;color:var(--green);margin-bottom:4px}
.input-group select,.input-group input{padding:10px 12px;border-radius:10px;border:1.5px solid #b9c7b4;
  font-family:inherit;font-size:15px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
.input-group select:focus,.input-group input:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(31,122,67,.18)}

main{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 12px 12px;min-height:0}

.lottery-engine{display:flex;align-items:center;justify-content:center;gap:32px;margin:12px 0 8px;flex-wrap:wrap}
.wheel-container{position:relative;width:120px;height:120px;flex:none}
.wheel-container::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:3;
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--red);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--green);outline:3px solid var(--gold);
  background:conic-gradient(#e74c3c 0 14.28%,#f1c40f 0 28.57%,#2ecc71 0 42.85%,#3498db 0 57.14%,#9b59b6 0 71.42%,#e67e22 0 85.7%,#1abc9c 0);
  box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.2)}
.hub{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold));border:3px solid var(--green);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.spinning{animation:spin .3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.side{display:flex;flex-direction:column;align-items:center;gap:10px}
.btn-modern{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border:none;padding:13px 38px;
  border-radius:999px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px rgba(20,83,45,.35);transition:transform .15s,box-shadow .15s}
.btn-modern:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,83,45,.4)}
.btn-modern:active:not(:disabled){transform:translateY(0)}
.btn-modern:disabled{opacity:.6;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.counter{font-size:14px;font-weight:600;color:var(--muted)}
.counter b{color:var(--green);font-size:18px}

#results-container{width:100%;flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth;min-height:0;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,.04)}
#results{display:grid;grid-template-columns:repeat(var(--cols,auto-fill),var(--card-w,80px));gap:var(--gap,8px);justify-content:center;align-content:start}
#results:empty::before{content:"তথ্য দিয়ে ‘লটারী শুরু করুন’ চাপুন — বিজয়ী নম্বরগুলো এখানে দেখা যাবে";
  grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 10px;font-size:16px}

.num-card{color:#fff;border-radius:10px;aspect-ratio:1.5/1;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:var(--font-size,20px);box-shadow:0 4px 8px rgba(0,0,0,.2),inset 0 -3px 0 rgba(0,0,0,.18);
  animation:popIn .3s ease-out forwards}
.c1{background:#c62828}.c2{background:#1565c0}.c3{background:#2e7d32}.c4{background:#7b1fa2}.c5{background:#ef6c00}.c6{background:#263c4f}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

#pdfBtn{position:fixed;bottom:22px;right:28px;background:linear-gradient(135deg,#d0392b,#a82a1f);color:#fff;
  padding:13px 26px;border-radius:12px;border:none;cursor:pointer;display:none;font-family:inherit;font-size:16px;font-weight:700;
  box-shadow:0 8px 20px rgba(168,42,31,.4);z-index:20}
#pdfBtn:disabled{opacity:.7;cursor:wait}

@media (prefers-reduced-motion:reduce){.spinning{animation-duration:1.2s}.num-card{animation:none}}
@media (max-width:600px){header{flex-direction:column;align-items:flex-start}.lottery-engine{gap:18px}}

/* নতুন লেআউট: বামে উপজেলা/ইউনিয়ন, মাঝখানে বড় হুইল, ডানে মোট কৃষক/বিজয়ী সংখ্যা */
.control-panel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:12px 32px}
.col{display:flex;flex-direction:column;gap:14px}
.col.left{justify-self:start;width:min(340px,100%)}
.col.right{justify-self:end;width:min(340px,100%)}
.col .input-group{max-width:none;min-width:0;flex:none}
.lottery-engine{flex-direction:column;gap:10px;margin:0}
.wheel-container{width:180px;height:180px;margin-top:12px}
.hub{width:46px;height:46px}
.wheel-container::before{border-left-width:13px;border-right-width:13px;border-top-width:24px;top:-14px}
@media (max-width:820px){.control-panel{grid-template-columns:1fr;gap:12px}.col.left,.col.right{justify-self:stretch;width:100%}.wheel-container{width:130px;height:130px}}
/* ছবির নির্দেশ অনুযায়ী: বক্সগুলো উপরে, বোতাম উইলের ডানে, প্যানেল কম উঁচু */
.control-panel{align-items:start;padding:10px 32px 12px}
.col{padding-top:16px}
.lottery-engine{flex-direction:row;align-items:center;gap:28px}
.wheel-container{margin-top:14px}
.side{align-items:center}
main{padding-bottom:20px}
.credit{position:fixed;left:8px;bottom:3px;font-size:11px;line-height:1;color:var(--muted);z-index:15;
  font-family:'Noto Sans Bengali',sans-serif;letter-spacing:0;pointer-events:none}
@media (max-width:820px){.lottery-engine{flex-direction:column;gap:10px}}
/* বক্সের বর্ডার ও লেখা বোল্ড */
.input-group label{font-weight:700;font-size:14px}
.input-group select,.input-group input{border:2.5px solid var(--green);font-weight:700;color:#0e2a18}
.input-group select option{font-weight:600}
/* হেডার: মাঝখানে শিরোনাম, নিচে সাবটাইটেল, গোলাকার সবুজ কার্ড */
header{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;
  margin:10px 12px 0;padding:14px 20px 12px;border-radius:18px;border-bottom:none;
  background:linear-gradient(120deg,#1b4d3e,#2d6a4f);box-shadow:0 6px 18px rgba(20,60,40,.25)}
header h1{font-size:clamp(22px,3vw,32px);font-weight:800;line-height:1.3}
header .badge{background:none;border:none;padding:0;border-radius:0;color:#fff;font-size:15px;font-weight:500;white-space:normal}
/* লটারী শেষে ফুল-স্ক্রিন ফ্লাশ, বাঁকা অভিনন্দন লেখা ও ফুলের পাপড়ি */
#congrats{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:90;pointer-events:none;text-align:center;padding:20px}
#congrats.show{display:flex}
#congrats::before{content:"";display:none;position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff 0,#fffbd0 38%,#ffe066 75%,#ffc233 100%);opacity:0}
@keyframes cgFlash{0%{opacity:0}6%{opacity:.97}17%{opacity:.35}28%{opacity:.97}40%{opacity:.35}52%{opacity:.95}64%{opacity:.4}76%{opacity:.75}100%{opacity:0}}
.cg-text{position:relative;display:flex;flex-direction:column;gap:4px;opacity:0;transform:rotate(-7deg);
  filter:drop-shadow(0 4px 5px rgba(80,45,0,.6))}
.cg-big,.cg-sub{color:transparent;background:linear-gradient(180deg,#ffe98a 0,#f7bf17 48%,#b07200 100%);-webkit-background-clip:text;background-clip:text;font-weight:800}
.cg-big{font-size:clamp(56px,13vw,170px);line-height:1.15}
.cg-sub{font-size:clamp(26px,6vw,80px);line-height:1.3}
#congrats.show .cg-text{animation:cgText 4.8s ease-in-out forwards}
@keyframes cgText{0%{opacity:0;transform:rotate(-7deg) scale(.6)}12%{opacity:1;transform:rotate(-7deg) scale(1.05)}24%{opacity:.6;transform:rotate(-7deg) scale(1)}36%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(-7deg) scale(1.1)}}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:95}
.petal{position:absolute;top:-40px;will-change:transform;animation:petalFall var(--dur) linear var(--delay) forwards}
.petal i{display:block;width:var(--s);height:calc(var(--s)*1.35);border-radius:150% 0 150% 0;background:var(--c);
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.15);animation:petalFlutter var(--fl) ease-in-out infinite alternate}
@keyframes petalFall{0%{transform:translate3d(0,-5vh,0) rotate(0)}100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}
@keyframes petalFlutter{0%{transform:rotateY(0) rotateX(20deg)}100%{transform:rotateY(70deg) rotateX(-30deg)}}
@media (prefers-reduced-motion:reduce){#petals{display:none}#congrats.show::before{animation:none;opacity:.3}#congrats.show .cg-text{animation:cgFade 4.8s forwards}@keyframes cgFade{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}}
/* PDF page */
#hidden-report{position:absolute;left:-9999px;top:0}
.pdf-page{width:800px;height:1131px;background:#fff;padding:36px 40px;position:relative;font-family:'Noto Sans Bengali',sans-serif;color:#111}
.pdf-header{text-align:center;border-bottom:3px double #14532d;margin-bottom:16px;padding-bottom:10px}
.pdf-header h1{font-size:26px;color:#14532d}
.pdf-header h2{font-size:18px;font-weight:600;margin-top:2px}
.pdf-meta{display:flex;justify-content:space-between;margin-bottom:16px;padding:10px 14px;border:1px solid #bbb;border-radius:6px;background:#f7faf5;font-size:15px;line-height:1.7}
.pdf-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.pdf-item{border:1px solid #444;padding:6px 0;text-align:center;font-weight:700;font-size:15px;border-radius:3px}
.pdf-foot{position:absolute;left:40px;right:40px;bottom:22px;display:flex;justify-content:space-between;font-size:13px;color:#555;border-top:1px solid #ccc;padding-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;font-weight:700;color:var(--green);min-height:16px;margin-top:3px;line-height:1.2}
.num-card.wait{background:#fff8e1;color:#7a4b00;border:2.5px solid var(--gold)}
.wait-head{grid-column:1/-1;margin-top:6px;padding:6px 12px;font-weight:800;font-size:15px;color:#7a4b00;background:#fff3d1;border-left:5px solid var(--gold);border-radius:6px}
.pdf-sec{font-weight:800;font-size:17px;color:#14532d;margin:0 0 8px;padding-left:8px;border-left:5px solid #e0a82e}
</style>
</head>
<body>

<header>
  <h1>🌾 কৃষক নির্বাচন ডিজিটাল লটারী ২০২৬</h1>
  <div id="loc-info" class="badge">খাদ্য বিভাগ, সুনামগঞ্জ</div>
</header>

<div class="control-panel">
  <div class="col left">
  <div class="input-group">
    <label for="upazila">উপজেলা</label>
    <select id="upazila" onchange="updateUnions()">
      <option value="">নির্বাচন করুন</option>
      <option value="সুনামগঞ্জ সদর">সুনামগঞ্জ সদর</option>
      <option value="শান্তিগঞ্জ">শান্তিগঞ্জ</option>
      <option value="দোয়ারাবাজার">দোয়ারাবাজার</option>
      <option value="বিশ্বম্ভরপুর">বিশ্বম্ভরপুর</option>
      <option value="ছাতক">ছাতক</option>
      <option value="জগন্নাথপুর">জগন্নাথপুর</option>
      <option value="দিরাই">দিরাই</option>
      <option value="শাল্লা">শাল্লা</option>
      <option value="ধর্মপাশা">ধর্মপাশা</option>
      <option value="তাহিরপুর">তাহিরপুর</option>
      <option value="জামালগঞ্জ">জামালগঞ্জ</option>
    </select>
  </div>
  <div class="input-group">
    <label for="union">ইউনিয়ন</label>
    <select id="union"><option value="">উপজেলা আগে বেছে নিন</option></select>
  </div>
  </div>
  <div class="lottery-engine">
    <div class="wheel-container"><div id="wheel"></div><div class="hub"></div></div>
    <div class="side">
      <button id="startBtn" class="btn-modern" onclick="startLottery()">লটারী শুরু করুন</button>
      <div class="counter">নির্বাচিত: <b id="drawn">০</b> জন<span id="wcnt" hidden> · অপেক্ষমাণ: <b id="drawnW">০</b> জন</span></div>
    </div>
  </div>
  <div class="col right">
  <div class="input-group">
    <label for="totalF">মোট কৃষক</label>
    <input type="number" id="totalF" value="0" min="0" oninput="updateWaitHint()">
  </div>
  <div class="row2">
    <div class="input-group">
      <label for="winnerC">বিজয়ী সংখ্যা</label>
      <input type="number" id="winnerC" value="0" min="0" oninput="updateWaitHint()">
    </div>
    <div class="input-group">
      <label for="waitP">অপেক্ষমাণ (%)</label>
      <input type="number" id="waitP" value="0" min="0" max="100" step="any" oninput="updateWaitHint()">
      <div class="hint" id="waitHint"></div>
    </div>
  </div>
  </div>
</div>

<main>
  <div id="results-container"><div id="results"></div></div>

  <button id="pdfBtn" onclick="downloadPDF()">📥 পিডিএফ ডাউনলোড</button>
</main>

<div id="hidden-report"></div>

<script>
const unionData = {
  "সুনামগঞ্জ সদর": ["সুনামগঞ্জ পৌরসভা","জাহাঙ্গীরনগর","সুরমা","রঙ্গারচর","কুরবাননগর","মোল্লাপাড়া","কাঠইর","লক্ষ্মণশ্রী","গৌরারং","মোহনপুর"],
  "শান্তিগঞ্জ": ["শিমুলবাক","জয়কলস","পাথারিয়া","দরগাপাশা","পূর্ব পাগলা","পশ্চিম পাগলা","পূর্ব বীরগাঁও","পশ্চিম বীরগাঁও"],
  "দোয়ারাবাজার": ["দোয়ারাবাজার","পান্ডারাগাঁও","লক্ষ্মীপুর","বোগলাবাজার","সুরমা","মান্নারগাঁও","দোহালিয়া","বাংলাবাজার","নরসিংপুর"],
  "বিশ্বম্ভরপুর": ["সলুকাবাদ","ফতেপুর","বাদাঘাট দক্ষিণ","পলাশ","ধনপুর"],
  "ছাতক": ["ছাতক সদর","নোয়ারাই","ইসলামপুর","কালারুকা","খুরমা উত্তর","খুরমা দক্ষিণ","জাউয়াবাজার","দোলারবাজার","গোবিন্দগঞ্জ-সৈদেরগাঁও","ছৈলা-আফজলাবাদ","সিংচাপইড়","ভাতগাঁও","চরমহল্লা"],
  "জগন্নাথপুর": ["কলকলিয়া","পাটলী","মিরপুর","চিলাউড়া হলদিপুর","জগন্নাথপুর দক্ষিণ","রানীগঞ্জ","সৈয়দপুর শাহারপাড়া","আশারকান্দি"],
  "দিরাই": ["রফিনগর","ভাটিপাড়া","রাজানগর","চরনারচর","দিরাই সরমঙ্গল","করিমপুর","জগদল","তাড়ল","কুলঞ্জ"],
  "শাল্লা": ["আটগাঁও","হবিবপুর","বাহাড়া","শাল্লা"],
  "ধর্মপাশা": ["বংশীকুন্ডা উত্তর","বংশীকুন্ডা দক্ষিণ","চামরদানী","মধ্যনগর","পাইকুরাটি","ধর্মপাশা","সেলবরষ","জয়শ্রী","সুখাইড় রাজাপুর উত্তর","সুখাইড় রাজাপুর দক্ষিণ"],
  "তাহিরপুর": ["শ্রীপুর উত্তর","শ্রীপুর দক্ষিণ","বড়দল উত্তর","বড়দল দক্ষিণ","তাহিরপুর সদর","বালিয়াঘাট","বাদাঘাট"],
  "জামালগঞ্জ": ["বেহেলী","জামালগঞ্জ সদর","ফেনারবাক","সাচনা বাজার","ভীমখালী"]
};

const fireConfetti = confetti.create(null, { resize: true, useWorker: false });
function showCongrats() {
  const el = document.getElementById('congrats');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4900);
  rainPetals();
}
// ফুলের পাপড়ি পুরো স্ক্রিন জুড়ে ঝরে পড়বে
function rainPetals() {
  const box = document.getElementById('petals');
  const colors = [
    'linear-gradient(135deg,#ffb3c7,#ff4d7d)','linear-gradient(135deg,#ff9aa2,#e63946)',
    'linear-gradient(135deg,#fff3a0,#ffb703)','linear-gradient(135deg,#ffffff,#ffd6e0)','linear-gradient(135deg,#ffd166,#f77f00)'
  ];
  const n = window.innerWidth < 600 ? 55 : 110;
  box.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    const st = p.style;
    st.left = (Math.random() * 100) + 'vw';
    st.setProperty('--s', (12 + Math.random() * 20) + 'px');
    st.setProperty('--c', colors[i % colors.length]);
    st.setProperty('--dur', (5 + Math.random() * 4) + 's');
    st.setProperty('--delay', (Math.random() * 3) + 's');
    st.setProperty('--dx', ((Math.random() - 0.5) * 40) + 'vw');
    st.setProperty('--rot', ((Math.random() - 0.5) * 900) + 'deg');
    st.setProperty('--fl', (0.5 + Math.random() * 0.9) + 's');
    p.appendChild(document.createElement('i'));
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 12500);
}
let winners = [];
let waiting = [];
let waitPct = 0;
// অপেক্ষমাণ সংখ্যা = বিজয়ী সংখ্যার শতাংশ (পূর্ণসংখ্যায় ওপরের দিকে), মোট কৃষকের বেশি হবে না
function calcWait() {
  const total = parseInt(document.getElementById('totalF').value) || 0;
  const count = parseInt(document.getElementById('winnerC').value) || 0;
  const pct = parseFloat(document.getElementById('waitP').value) || 0;
  let n = Math.ceil(count * pct / 100);
  const room = Math.max(0, total - count);
  return Math.min(n, room);
}
function updateWaitHint() {
  const total = parseInt(document.getElementById('totalF').value) || 0;
  const count = parseInt(document.getElementById('winnerC').value) || 0;
  const pct = parseFloat(document.getElementById('waitP').value) || 0;
  const raw = Math.ceil(count * pct / 100), n = calcWait();
  const h = document.getElementById('waitHint');
  h.textContent = pct > 0 ? ('= ' + toBN(n) + ' জন' + (raw > n ? ' (সীমিত)' : '')) : '';
}
// সব কার্ড যেন স্ক্রল ছাড়াই এক স্ক্রিনে ধরে, সেই অনুযায়ী কার্ডের মাপ ঠিক করে
function fitCards(resDiv, container, count, wait) {
  const n = count + wait;
  const gap = n > 150 ? 5 : 8;
  const W = container.clientWidth - 24;
  const H = container.clientHeight - 24 - (wait > 0 ? 44 : 0);
  const rowsFor = c => Math.ceil(count / c) + Math.ceil(wait / c);
  let w = 100;
  for (; w > 24; w--) {
    const cols = Math.max(1, Math.floor((W + gap) / (w + gap)));
    if (rowsFor(cols) * (w / 1.5 + gap) - gap <= H) break;
  }
  const cols = Math.max(1, Math.floor((W + gap) / (w + gap)));
  resDiv.style.setProperty('--card-w', w + 'px');
  resDiv.style.setProperty('--cols', cols);
  resDiv.style.setProperty('--gap', gap + 'px');
  resDiv.style.setProperty('--font-size', Math.max(11, Math.round(w * 0.36)) + 'px');
}
function startLottery() {
  const upa = document.getElementById('upazila').value;
  const uni = document.getElementById('union').value;
  const total = parseInt(document.getElementById('totalF').value);
  const count = parseInt(document.getElementById('winnerC').value);
  const pct = parseFloat(document.getElementById('waitP').value) || 0;

  if (!upa || !uni) { alert("উপজেলা এবং ইউনিয়ন নির্বাচন করুন!"); return; }
  if (!(count > 0)) { alert("বিজয়ী সংখ্যা দিন!"); return; }
  if (count > total) { alert("বিজয়ী সংখ্যা বেশি হতে পারে না!"); return; }
  if (pct < 0 || pct > 100) { alert("অপেক্ষমাণের শতাংশ ০ থেকে ১০০ এর মধ্যে হতে হবে!"); return; }

  const waitN = calcWait();
  const resDiv = document.getElementById('results');
  const container = document.getElementById('results-container');
  fitCards(resDiv, container, count, waitN);
  resDiv.innerHTML = ""; winners = []; waiting = []; waitPct = pct;
  document.getElementById('drawn').innerText = toBN(0);
  document.getElementById('drawnW').innerText = toBN(0);
  document.getElementById('wcnt').hidden = waitN === 0;
  document.getElementById('pdfBtn').style.display = 'none';

  document.getElementById('wheel').classList.add('spinning');
  document.getElementById('startBtn').disabled = true;

  // একই পুল থেকে আগে বিজয়ী, তারপর অপেক্ষমাণ (কেউ দুই তালিকায় আসবে না)
  let pool = Array.from({length: total}, (_, i) => i + 1);
  for (let i = 0; i < count; i++) {
    let idx = Math.floor(Math.random() * pool.length);
    winners.push(pool.splice(idx, 1)[0]);
  }
  for (let i = 0; i < waitN; i++) {
    let idx = Math.floor(Math.random() * pool.length);
    waiting.push(pool.splice(idx, 1)[0]);
  }

  const all = winners.concat(waiting);
  all.forEach((num, i) => {
    setTimeout(() => {
      const isWait = i >= count;
      if (isWait && i === count) {
        const head = document.createElement('div');
        head.className = 'wait-head';
        head.innerText = `অপেক্ষমাণ তালিকা (${toBN(waitN)} জন)`;
        resDiv.appendChild(head);
      }
      const card = document.createElement('div');
      card.className = isWait ? 'num-card wait' : `num-card c${(i % 6) + 1}`;
      card.innerText = toBN(num);
      resDiv.appendChild(card);
      if (isWait) document.getElementById('drawnW').innerText = toBN(i - count + 1);
      else document.getElementById('drawn').innerText = toBN(i + 1);
      container.scrollTop = container.scrollHeight;

      if (i === all.length - 1) {
        document.getElementById('wheel').classList.remove('spinning');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pdfBtn').style.display = 'block';
        fireConfetti({ particleCount: 200, spread: 80 });
        showCongrats();
      }
    }, i * 350);
  });
}

// প্রতি পেজে ১২০টি নম্বর (১০ কলাম × ১২ সারি); বেশি হলে নতুন পেজ
const PER_PAGE = 120;

async function downloadPDF() {
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true; btn.innerText = '⏳ পিডিএফ তৈরি হচ্ছে...';
  try {
    const upa = document.getElementById('upazila').value;
    const uni = document.getElementById('union').value;
    const total = toBN(document.getElementById('totalF').value);
    const win = toBN(winners.length);
    const waitLine = waiting.length ? `<div><strong>অপেক্ষমাণ সংখ্যা:</strong> ${toBN(waiting.length)} (${toBN(waitPct)}%)</div>` : '';
    const date = toBN(new Date().toLocaleDateString('bn-BD'));

    // স্ক্রিনের সিরিয়ালেই: আগে বিজয়ী তালিকা, তারপর অপেক্ষমাণ তালিকা
    const sections = [];
    for (let k = 0; k < winners.length; k += PER_PAGE) sections.push({ t: 'বিজয়ী তালিকা', list: winners.slice(k, k + PER_PAGE) });
    for (let k = 0; k < waiting.length; k += PER_PAGE) sections.push({ t: 'অপেক্ষমাণ তালিকা', list: waiting.slice(k, k + PER_PAGE) });
    const pages = Math.max(1, sections.length);
    const holder = document.getElementById('hidden-report');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    for (let p = 0; p < pages; p++) {
      const sec = sections[p] || { t: 'বিজয়ী তালিকা', list: [] };
      const chunk = sec.list;
      holder.innerHTML = `
        <div class="pdf-page">
          <div class="pdf-header">
            <h1>খাদ্য বিভাগ, সুনামগঞ্জ</h1>
            <h2>আমন ধান সংগ্রহের লটারীর ফলাফল - ২০২৬-২৭</h2>
          </div>
          <div class="pdf-meta">
            <div><div><strong>উপজেলা:</strong> ${upa}</div><div><strong>ইউনিয়ন:</strong> ${uni}</div></div>
            <div style="text-align:right"><div><strong>মোট কৃষক:</strong> ${total}</div>
              <div><strong>বিজয়ী সংখ্যা:</strong> ${win}</div>${waitLine}<div><strong>তারিখ:</strong> ${date}</div></div>
          </div>
          <div class="pdf-sec">${sec.t}</div>
          <div class="pdf-grid">${chunk.map(n => `<div class="pdf-item">${toBN(n)}</div>`).join('')}</div>
          <div class="pdf-foot"><span>${uni}, ${upa}</span><span>পৃষ্ঠা ${toBN(p + 1)} / ${toBN(pages)}</span></div>
        </div>`;
      const canvas = await html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });
      if (p > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
    }
    holder.innerHTML = '';
    pdf.save(`Result_${uni}.pdf`);
  } catch (e) {
    alert('পিডিএফ তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
  } finally {
    btn.disabled = false; btn.innerText = '📥 পিডিএফ ডাউনলোড';
  }
}
